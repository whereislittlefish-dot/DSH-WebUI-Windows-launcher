name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 这条步骤只为留下可诊断的信息：构建失败时能从日志看出
      # runner 上到底有没有 csc.exe、文件是否正常检出。
      - name: Environment check
        shell: pwsh
        run: |
          Write-Output "PowerShell : $($PSVersionTable.PSVersion)"
          Write-Output "PWD        : $(Get-Location)"
          Write-Output "--- repository files ---"
          Get-ChildItem -Recurse -File | ForEach-Object { Write-Output ("  " + $_.FullName.Replace((Get-Location).Path + '\', '')) }
          Write-Output "--- csc.exe candidates ---"
          $cands = @(
            (Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),
            (Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe'),
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\Roslyn\csc.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\Roslyn\csc.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\Roslyn\csc.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\Roslyn\csc.exe"
          )
          foreach ($c in $cands) { Write-Output ("  {0}  {1}" -f $(if (Test-Path -LiteralPath $c) { 'FOUND' } else { 'missing' }), $c) }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          Write-Output ("vswhere    : {0}" -f $(if (Test-Path -LiteralPath $vswhere) { 'found' } else { 'missing' }))

      - name: Build single-file launcher
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-WebUI-Windows-launcher
          path: dist/dsh-webui.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-webui.exe
          generate_release_notes: true
